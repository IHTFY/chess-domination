<!DOCTYPE html>
<html lang="en" class="black white-text">
  <head>
    <meta charset="utf-8" />
    <title>Domination</title>
    <link rel="manifest" href="manifest.json" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicons/favicon-16x16.png"
    />

    <link rel="icon" href="favicons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicons/icon.svg" type="image/svg+xml" sizes="any" />
    <meta name="description" content="Chess puzzles about placing non-attacking pieces and controlling every square on the board." />
    <meta name="theme-color" content="#0b1730" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Domination" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="msapplication-config" content="favicons/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#0b1730" />

    <link href="style/icons/materialIcons.css" rel="stylesheet" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <script type="module" src="scripts/chessboard-element.bundled.js"></script>

    <link rel="stylesheet" type="text/css" href="style/materialize.min.css" />
    <!-- After Materialize so local overrides win. -->
    <link rel="stylesheet" type="text/css" href="style/global.css" />
    <script src="style/materialize.min.js"></script>

    <script defer type="module" src="scripts/main.js"></script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7816252471679024"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((reg) => {
              console.log("Service worker registered.", reg);
            })
            .catch((err) => {
              console.error("Service worker not registered.", err);
            });
        });
      }
    </script>
    <div id="app">
      <header id="topbar" class="panel">
        <a
          href="https://github.com/IHTFY/chess-domination"
          target="_blank"
          aria-label="Source on GitHub"
        >
          <svg id="gh_logo" viewBox="0 0 32 32" height="28" width="28">
            <path
              fill="#039be5"
              d="M16 0C7.2 0 0 7.2 0 16c0 7.1 4.6 13 11 15 .8 .14 1.1-.34 1.1-.76 0-.38-.02-1.6-.02-3-4 .74-5.1-.98-5.4-1.9-.18-.46-.96-1.9-1.6-2.3-.56-.3-1.4-1-.02-1.1 1.3-.02 2.2 1.2 2.5 1.6 1.4 2.4 3.7 1.7 4.7 1.3 .14-1 .56-1.7 1-2.1-3.6-.4-7.3-1.8-7.3-7.9 0-1.7 .62-3.2 1.6-4.3-.16-.4-.72-2 .16-4.2 0 0 1.3-.42 4.4 1.6 1.3-.36 2.6-.54 4-.54 1.4 0 2.7 .18 4 .54 3.1-2.1 4.4-1.6 4.4-1.6 .88 2.2 .32 3.8 .16 4.2 1 1.1 1.6 2.5 1.6 4.3 0 6.1-3.7 7.5-7.3 7.9 .58 .5 1.1 1.5 1.1 3 0 2.1-.02 3.9-.02 4.4 0 .42 .3 .92 1.1 .76A16 16 0 0 0 32 16c0-8.8-7.2-16-16-16z"
            ></path>
          </svg>
        </a>
        <div class="switch">
          <label>
            Sound
            <input id="soundSwitch" type="checkbox" checked="checked" />
            <span class="lever"></span>
          </label>
        </div>
        <div class="switch">
          <label>
            Highlight
            <input id="highlightSwitch" type="checkbox" checked="checked" />
            <span class="lever"></span>
          </label>
        </div>
        <button
          id="statsBtn"
          class="icon-btn"
          aria-label="Show scores"
          aria-controls="statsPanel"
        >
          <i class="material-icons">leaderboard</i>
        </button>
        <a
          href="https://ihtfy.com/domination"
          target="_blank"
          class="icon-btn"
          aria-label="About"
        >
          <i class="material-icons">info</i>
        </a>
      </header>

      <main id="boardPanel">
        <chess-board id="board"> </chess-board>
      </main>

      <section id="options" class="panel no-select">
        <div class="options-row">
          <div class="switch">
            <label>
              Non-Attacking
              <input id="modeSwitch" type="checkbox" />
              <span class="lever"></span>
              Domination
            </label>
          </div>
          <button id="clearBtn" class="waves-effect btn red lighten-1">
            <i class="material-icons">refresh</i><span>Clear</span>
          </button>
        </div>
        <div class="solve-row">
          <span class="solve-label">Solve</span>
          <button id="kingBtn" class="waves-effect btn indigo" aria-label="Solve king">♔</button>
          <button id="queenBtn" class="waves-effect btn indigo" aria-label="Solve queen">♕</button>
          <button id="rookBtn" class="waves-effect btn indigo" aria-label="Solve rook">♖</button>
          <button id="bishopBtn" class="waves-effect btn indigo" aria-label="Solve bishop">♗</button>
          <button id="knightBtn" class="waves-effect btn indigo" aria-label="Solve knight">♘</button>
          <button id="pawnBtn" class="waves-effect btn indigo" aria-label="Solve pawn">♙</button>
        </div>
      </section>

      <div id="statsBackdrop"></div>
      <section id="statsPanel" class="panel" aria-label="Scores">
        <button id="statsClose" class="icon-btn" aria-label="Close scores">
          <i class="material-icons">close</i>
        </button>
        <div id="stats" role="table" aria-label="Scores">
          <div class="corner" role="columnheader">
            <button
              id="resetBtn"
              class="waves-effect btn red"
              aria-label="Reset scores"
              title="Reset scores"
            >
              <i class="material-icons">clear</i>
            </button>
          </div>
          <div class="head" role="columnheader" title="Pieces on board">
            <i class="material-icons">numbers</i>
          </div>
          <div class="head" role="columnheader">Record</div>
          <div class="head" role="columnheader" title="Difference from perfect">
            <i class="material-icons">difference</i>
          </div>
          <div class="head" role="columnheader">Perfect</div>
          <div class="piece" role="rowheader">♔</div>
          <div class="animated-number" role="cell" id="kingCount"></div>
          <div class="animated-number" role="cell" id="kingBest"></div>
          <div class="animated-number" role="cell" id="kingDiff"></div>
          <div class="animated-number" role="cell" id="kingPossible"></div>
          <div class="piece" role="rowheader">♕</div>
          <div class="animated-number" role="cell" id="queenCount"></div>
          <div class="animated-number" role="cell" id="queenBest"></div>
          <div class="animated-number" role="cell" id="queenDiff"></div>
          <div class="animated-number" role="cell" id="queenPossible"></div>
          <div class="piece" role="rowheader">♖</div>
          <div class="animated-number" role="cell" id="rookCount"></div>
          <div class="animated-number" role="cell" id="rookBest"></div>
          <div class="animated-number" role="cell" id="rookDiff"></div>
          <div class="animated-number" role="cell" id="rookPossible"></div>
          <div class="piece" role="rowheader">♗</div>
          <div class="animated-number" role="cell" id="bishopCount"></div>
          <div class="animated-number" role="cell" id="bishopBest"></div>
          <div class="animated-number" role="cell" id="bishopDiff"></div>
          <div class="animated-number" role="cell" id="bishopPossible"></div>
          <div class="piece" role="rowheader">♘</div>
          <div class="animated-number" role="cell" id="knightCount"></div>
          <div class="animated-number" role="cell" id="knightBest"></div>
          <div class="animated-number" role="cell" id="knightDiff"></div>
          <div class="animated-number" role="cell" id="knightPossible"></div>
          <div class="piece" role="rowheader">♙</div>
          <div class="animated-number" role="cell" id="pawnCount"></div>
          <div class="animated-number" role="cell" id="pawnBest"></div>
          <div class="animated-number" role="cell" id="pawnDiff"></div>
          <div class="animated-number" role="cell" id="pawnPossible"></div>
        </div>
      </section>
    </div>
  </body>
</html>
